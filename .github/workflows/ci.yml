name: CI

on:
  push:
    branches: ["**"]

jobs:
  ci-rails-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.3.13"]
        node: ["20"]
    env:
      RAILS_ENV: test
      NOKOGIRI_USE_SYSTEM_LIBRARIES: true

    steps:
      - uses: actions/checkout@v7
      - name: Install libxslt for nokogiri gem (required for version < 1.11)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev
      - name: Add --no-document option to .gemrc file to speed up bundle install
        run: "echo 'gem: --no-document' > ~/.gemrc"
      - name: Write CI ruby version to .ruby-version file
        run: "echo '${{ matrix.ruby-version }}' > .ruby-version"
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "8"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g yarn
      - run: yarn install --frozen-lockfile
      - name: Copy config files
        run: bin/copy-config-template-files
      - name: Create test credentials
        run: bundle exec rake "ac:templated_credentials:add[test]"
      - name: Load DB Schema
        run: bundle exec rake db:schema:load
      - name: Prepare DB
        run: bundle exec rake db:test:prepare
      - name: Run Type Checks
        run: bundle exec rake ac:type_check
      - name: Run default rake task (CI)
        run: bundle exec rake
